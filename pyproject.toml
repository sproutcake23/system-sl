[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-sl"
dynamic = ["version"]
description = "A Solo Leveling-inspired task management system with AI chatbot, Google Tasks sync, and gamified productivity."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "sproutcake23"},
  {name = "Pranav770 "},
  {name = "yashnarayan123"},
  {name = "sriram936"}
]
keywords = [
  "task-management",
  "productivity",
  "solo-leveling",
  "gamification",
  "ai-chatbot",
  "google-tasks",
  "pyside6",
  "qt"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Utilities",
]
dependencies = [
  "pyside6",
  "qtpy",
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "python-dotenv>=1.2.2",
  "langchain>=1.3.1",
  "langchain-core>=1.4.0",
  "langchain-google-genai>=4.2.3",
  "langchain-openai>=0.3.0",
  "langsmith>=0.8.5",
  "numpy>=2.4.6",
  "openai>=2.38.0",
  "protobuf>=7.35.0",
  "spacy>=3.8.14",
  "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
  "click>=8.4.1",
  "pyspellchecker",
  "colorthief==0.2.1",
  "Pillow==12.3.0",
  "imagecodecs>=2025.3.30,<2026",
  "requests>=2.31.0",
  "certifi>=2024.8.30",
  "keyring>=25.3.0",
  "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/sproutcake23/System-SL"
Repository = "https://github.com/sproutcake23/System-SL"
Issues = "https://github.com/sproutcake23/System-SL/issues"
Documentation = "https://github.com/sproutcake23/System-SL/tree/main/docs/wiki"

[project.optional-dependencies]
build = ["pyinstaller>=6.20.0"]

[project.scripts]
system-sl = "system_sl.frontend.gui.main:main"
build-sl = "system_sl.utils.build:main"

[tool.setuptools]
include-package-data = true

# The version lives in one place only: system_sl.__version__. A frozen
# PyInstaller build has no package metadata to read, and the auto-updater
# needs to know which version is actually running.
[tool.setuptools.dynamic]
version = {attr = "system_sl.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["system_sl*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.mp3", "*.wav", "*.svg", "*.png", "*.gif"]