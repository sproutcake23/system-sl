name: CI

# Lint and test every push to main and every pull request. The release
# workflow calls this same job before it builds, so the two can't drift.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # Qt (offscreen), QtMultimedia and the OCR tests need these at runtime.
      - name: Install system libraries for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0 \
            tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint
        run: uvx ruff check src tests

      - name: Test (memory-capped, on-disk temp)
        run: |
          B="$HOME/.cache/system-sl-pytest"
          mkdir -p "$B/tmp"
          # Hosted runners have no user systemd session, so systemd-run is
          # not available; cap address space with ulimit instead (1500M is
          # too tight for virtual memory, so allow 4G) and bound run time.
          ulimit -v 4194304
          TMPDIR="$B/tmp" QT_QPA_PLATFORM=offscreen \
            timeout 300 uv run --frozen --extra test pytest -q --basetemp="$B/run"
