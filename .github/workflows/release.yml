name: Release

on:
  push:
    tags:
      - "v*"
  # Build and test without publishing, so a packaging change can be checked
  # before it reaches a tag. Only the release job publishes, and only for tags.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/system_sl/chatbot/documents.py"
      - "src/system_sl/utils/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --extra build

      - name: Bundle wallust 3.5.2
        run: |
          mkdir -p vendor/wallust
          curl -fsSL -o "$RUNNER_TEMP/wallust.tar.gz" \
            "https://codeberg.org/explosion-mental/wallust/releases/download/3.5.2/wallust-3.5.2-x86_64-unknown-linux-musl.tar.gz"
          echo "92e11a841827ea6c2af28290d2cf4908db07dff4aee8dec1b7f1133cbf72c6e2  $RUNNER_TEMP/wallust.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wallust.tar.gz" -C vendor/wallust
          chmod +x vendor/wallust/wallust
          test -x vendor/wallust/wallust

      # Qt's xcb platform plugin links against these. PyInstaller only bundles
      # libraries present on the build machine, and without them the AppImage
      # aborts on systems that lack libxcb-cursor0 and friends.
      - name: Install Qt xcb libraries to bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 \
            libxcb-xkb1 libxkbcommon-x11-0

      # OCR support (tesseract + poppler for pdf2image)
      - name: Install OCR system dependencies
        run: |
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
          # Debian/Ubuntu keep the language data in
          # /usr/share/tesseract-ocr/<major>/tessdata, while the build passes
          # /usr/share/tessdata (the Arch layout). Normalise the path so one
          # build command works on both, and fail here rather than silently
          # shipping an OCR-less binary.
          traineddata="$(find /usr/share -maxdepth 5 -name eng.traineddata -print -quit)"
          test -n "$traineddata"
          if [ ! -e /usr/share/tessdata ]; then
            sudo ln -s "$(dirname "$traineddata")" /usr/share/tessdata
          fi
          test -f /usr/share/tessdata/eng.traineddata

      # The app's Google OAuth client is a repository secret, not a committed
      # file, so it stays out of git history and can be rotated. Fail rather
      # than ship a build where Google sync can never sign in.
      - name: Bundle Google OAuth client
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CLIENT" ]; then
            echo "::error::The GOOGLE_OAUTH_CLIENT repository secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_OAUTH_CLIENT" > src/system_sl/assets/google_oauth_client.json
          python -c "import json, sys; assert 'installed' in json.load(open(sys.argv[1])), 'not a Desktop app OAuth client'" \
            src/system_sl/assets/google_oauth_client.json

      - name: Build binary with PyInstaller
        run: |
          uv run python -m PyInstaller packaging/system-sl.spec --noconfirm --clean

      - name: Check Qt xcb libraries and OAuth client are bundled
        run: |
          uv run python - <<'EOF'
          from PyInstaller.archive.readers import CArchiveReader

          bundled = {name.rsplit("/", 1)[-1] for name in CArchiveReader("dist/system-sl").toc}
          required = [
              "libxcb-cursor.so.0", "libxcb-icccm.so.4", "libxcb-image.so.0",
              "libxcb-keysyms.so.1", "libxcb-render-util.so.0", "libxcb-shape.so.0",
              "libxcb-util.so.1", "libxcb-xkb.so.1", "libxkbcommon-x11.so.0",
              # OCR language data: without it tesseract cannot read anything.
              "eng.traineddata",
              # Dynamic theming runs this bundled binary.
              "wallust",
          ]
          # OCR binaries
          ocr_required = [
              "tesseract", "pdftoppm", "pdfinfo",
          ]
          missing = [lib for lib in required if lib not in bundled]
          missing += [lib for lib in ocr_required if lib not in bundled]
          if "google_oauth_client.json" not in bundled:
              missing.append("google_oauth_client.json")
          if missing:
              raise SystemExit(f"Not bundled: {', '.join(missing)}")
          print("All Qt xcb libraries, OCR tools, wallust and the Google OAuth client are bundled.")
          EOF

      - name: Package binary (tar.xz)
        run: tar -cJf system-sl-linux.tar.xz -C dist system-sl

      # Makes its own one-folder build, separate from the one-file dist/system-sl.
      - name: Build AppImage
        run: |
          uv run python packaging/appimage/build-appimage.py

      - name: Smoke-test AppImage launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0
          # --install-desktop moves the AppImage into ~/Applications, so test
          # a copy and keep the built file in dist/ for the upload steps.
          test_home="$RUNNER_TEMP/appimage-home"
          mkdir -p "$test_home"
          cp dist/system-sl-*-x86_64.AppImage "$RUNNER_TEMP/"
          HOME="$test_home" \
            "$RUNNER_TEMP"/system-sl-*-x86_64.AppImage --appimage-extract-and-run --install-desktop
          ls "$test_home"/Applications/system-sl-*-x86_64.AppImage
          grep '^Exec=' "$test_home/.local/share/applications/system-sl.desktop"
          test -f "$test_home/.local/share/icons/hicolor/scalable/apps/system-sl.svg"

      # OCR must work from the bundle alone, so hide the build machine's tools.
      - name: Check OCR works in the frozen builds
        run: |
          sudo mv /usr/bin/tesseract /usr/bin/pdftoppm /usr/bin/pdfinfo "$RUNNER_TEMP/"
          test_home="$RUNNER_TEMP/ocr-home"
          mkdir -p "$test_home"
          HOME="$test_home" dist/system-sl --check-ocr
          HOME="$test_home" dist/system-sl-*-x86_64.AppImage --appimage-extract-and-run --check-ocr

      - name: Check the GUI works in the frozen build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test_home="$RUNNER_TEMP/gui-home"
          mkdir -p "$test_home"
          HOME="$test_home" dist/system-sl --check-gui
          HOME="$test_home" dist/system-sl-*-x86_64.AppImage --appimage-extract-and-run --check-gui

      - name: Check Dynamic theming works in the frozen builds
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test_home="$RUNNER_TEMP/theme-home"
          mkdir -p "$test_home"
          HOME="$test_home" dist/system-sl --check-theme
          HOME="$test_home" dist/system-sl-*-x86_64.AppImage --appimage-extract-and-run --check-theme

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: system-sl-linux
          path: system-sl-linux.tar.xz

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: system-sl-appimage
          path: |
            dist/system-sl-*-x86_64.AppImage
            dist/system-sl-*-x86_64.AppImage.zsync

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --extra build

      - name: Bundle wallust 3.5.2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/wallust | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "wallust.tar.gz"
          Invoke-WebRequest -Uri "https://codeberg.org/explosion-mental/wallust/releases/download/3.5.2/wallust-3.5.2-x86_64-pc-windows-gnu.tar.gz" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "0f06d38ce329c9d0e26447eef63ba09ab2f3255663814986213cd7061f596e4f") {
            throw "wallust archive checksum mismatch: $hash"
          }
          tar -xzf $archive -C vendor/wallust
          if (-not (Test-Path vendor/wallust/wallust.exe)) {
            throw "wallust.exe was not extracted"
          }

      - name: Bundle Google OAuth client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if (-not $env:GOOGLE_OAUTH_CLIENT) {
            Write-Output "::error::The GOOGLE_OAUTH_CLIENT repository secret is not set."
            exit 1
          }
          Set-Content -Path src/system_sl/assets/google_oauth_client.json -Value $env:GOOGLE_OAUTH_CLIENT -NoNewline -Encoding utf8NoBOM
          python -c "import json, sys; assert 'installed' in json.load(open(sys.argv[1])), 'not a Desktop app OAuth client'" `
            src/system_sl/assets/google_oauth_client.json

      # Each tool gets its own folder: their DLLs share names but not versions,
      # and Windows loads the copy next to the executable.
      - name: Collect OCR tools
        shell: pwsh
        run: |
          choco install tesseract poppler -y --no-progress
          $tesseract = "C:\Program Files\Tesseract-OCR"
          $popplerPackage = "C:\ProgramData\chocolatey\lib\poppler"
          $pdftoppm = Get-ChildItem $popplerPackage -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not (Test-Path "$tesseract\tesseract.exe") -or -not $pdftoppm) {
            Write-Output "::error::Could not find the tesseract and poppler tools."
            exit 1
          }
          New-Item -ItemType Directory -Force ocr-bundle/tesseract, ocr-bundle/tessdata, ocr-bundle/poppler | Out-Null
          Copy-Item "$tesseract\tesseract.exe", "$tesseract\*.dll" ocr-bundle/tesseract
          Copy-Item "$tesseract\tessdata\eng.traineddata" ocr-bundle/tessdata
          $bin = $pdftoppm.Directory.FullName
          Copy-Item "$bin\pdftoppm.exe", "$bin\pdfinfo.exe", "$bin\*.dll" ocr-bundle/poppler
          "TESSERACT_DIR=$tesseract" >> $env:GITHUB_ENV
          "POPPLER_PACKAGE_DIR=$popplerPackage" >> $env:GITHUB_ENV

      - name: Build binary with PyInstaller
        shell: pwsh
        run: |
          uv run python -m PyInstaller packaging/system-sl.spec --noconfirm --clean

      # OCR must work from the bundle alone, so hide the build machine's tools.
      - name: Check OCR works in the frozen build
        shell: pwsh
        run: |
          Rename-Item $env:TESSERACT_DIR "$env:TESSERACT_DIR-hidden"
          Rename-Item $env:POPPLER_PACKAGE_DIR "$env:POPPLER_PACKAGE_DIR-hidden"
          $report = Join-Path $env:RUNNER_TEMP "ocr-report.txt"
          $run = Start-Process dist/system-sl.exe -ArgumentList "--check-ocr", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($run.ExitCode -ne 0) {
            Write-Output "::error::OCR check failed with exit code $($run.ExitCode)."
            exit 1
          }

      - name: Check the GUI works in the frozen build
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "gui-report.txt"
          $run = Start-Process dist/system-sl.exe -ArgumentList "--check-gui", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($run.ExitCode -ne 0) {
            Write-Output "::error::GUI check failed with exit code $($run.ExitCode)."
            exit 1
          }

      - name: Check Dynamic theming works in the frozen build
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "theme-report.txt"
          $run = Start-Process dist/system-sl.exe -ArgumentList "--check-theme", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($run.ExitCode -ne 0) {
            Write-Output "::error::Theme check failed with exit code $($run.ExitCode)."
            exit 1
          }

      - name: Package binary (zip)
        shell: pwsh
        run: Compress-Archive -Path dist/system-sl.exe -DestinationPath "system-sl-windows.zip"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version 3.09

      - name: Prepare NSIS assets
        shell: pwsh
        run: |
          # Copy sounds to packaging/windows for NSIS
          $nsisDir = "packaging/windows"
          if (-not (Test-Path $nsisDir)) { New-Item -ItemType Directory -Path $nsisDir }
          Copy-Item -Path "dist/system-sl.exe" -Destination "$nsisDir/system-sl.exe" -Force
          Copy-Item -Path "src/system_sl/assets/sounds" -Destination "$nsisDir/sounds" -Recurse -Force
          Copy-Item -Path "LICENSE" -Destination "$nsisDir/LICENSE" -Force

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cd packaging/windows
          & "C:\Program Files (x86)\NSIS\makensis.exe" system-sl.nsi
          Copy-Item -Path "system-sl-setup.exe" -Destination "../../dist/system-sl-setup.exe" -Force

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: system-sl-windows
          path: system-sl-windows.zip

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: system-sl-setup
          path: dist/system-sl-setup.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # Full history and tags, so the notes step can find the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: system-sl-linux

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: system-sl-appimage

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: system-sl-windows

      - name: Download NSIS installer
        uses: actions/download-artifact@v8
        with:
          name: system-sl-setup

      # The auto-updater verifies downloads against this file.
      - name: Write checksums
        run: >
          sha256sum
          system-sl-linux.tar.xz
          system-sl-*.AppImage
          system-sl-*.AppImage.zsync
          system-sl-windows.zip
          system-sl-setup.exe
          > SHA256SUMS.txt

      # Scope the notes to changes since the previous tag. A fixed start tag
      # here made every release list everything since that tag.
      - name: Find previous release tag
        id: prev
        run: echo "tag=$(git describe --tags --abbrev=0 '${{ github.ref_name }}^')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          system-sl-linux.tar.xz
          system-sl-*.AppImage
          system-sl-*.AppImage.zsync
          system-sl-windows.zip
          system-sl-setup.exe
          SHA256SUMS.txt
          --title "THE SYSTEM ${{ github.ref_name }}"
          --generate-notes
          --notes-start-tag "${{ steps.prev.outputs.tag }}"
